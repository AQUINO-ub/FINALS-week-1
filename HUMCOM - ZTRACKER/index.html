
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZTRACKER Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard">

        <!-- NAVIGATION (LEFT)-->

        <aside class="sidebar">
            <div class="Logo">
                <img src="ASSETS/LogoZTRACKER.png" alt="Logo">
                <h1>ZTRACKER</h1>
            </div>

            <button class="settings-button">
                Settings
            </button>

            <nav class="navigation">

                <a href="index.html">HOME</a>

                <a href="Courses.html">COURSES</a>

                <a href="Schedule.html">SCHEDULE</a>

                <a href="Tasks.html">TASKS</a>

            </nav>
        </aside>



        <!-- MAIN CONTENT -->
         <div class="main-container">
            <div class="main-content">


            <div class="main-content-box">
            <div class="pfp">
                <img src="ASSETS/ProfileImage.jpg" alt="Profile Image">
            </div>
                <p>Name:</p>
                <p>Course:</p>
                <p>Section:</p>
                <p>Year Level:</p>
            </div>


            <div class="main-content-box">
                <h2>Content box</h2>
                <p>You can see your stats here like how many courses you have, how many tasks that course has. etc...</p>
            </div>
        
            </div>
        </div>




        <!-- RIGHT SIDEBAR - HOME -->
        <div class="right-sidebar">
            <h2>Upcoming </h2>
            <div class="task-box">
                <h3>Task 1</h3>
                <p>Description of Task 1.</p>
            </div>
            <div class="task-box">
                <h3>Task 2</h3>
                <p>Description of Task 2.</p>
            </div>
        </div>
